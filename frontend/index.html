<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Manrope (UI text) + JetBrains Mono (numbers/tabular data) — tokens.css
         referenced both by name already but neither was actually loaded, so
         every page has been rendering in plain OS system fonts this whole
         time. preconnect first so the actual font fetch doesn't wait on DNS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Render's free tier + a cross-origin API means the first request pays
         DNS + TCP + TLS before a single byte of data comes back. Preconnect
         so that handshake overlaps with the rest of the page loading instead
         of happening only once the app's first fetch actually fires. -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TradeLogger" />
    <title>TradeLogger — Trading Journal & Research Terminal</title>
    <meta
      name="description"
      content="TradeLogger is a private trading journal and research terminal — log trades, analyze performance, track risk, and follow market context in one place. Read-only: no live order execution."
    />
    <link rel="canonical" href="https://tradelogger.site/" />

    <!-- Open Graph (Discord, Telegram, Slack, Facebook, iMessage, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TradeLogger" />
    <meta property="og:title" content="TradeLogger — Trading Journal & Research Terminal" />
    <meta
      property="og:description"
      content="Log trades, analyze performance, track risk, and follow market context in one place. Read-only: no live order execution."
    />
    <meta property="og:url" content="https://tradelogger.site/" />
    <meta property="og:image" content="https://tradelogger.site/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X card (reads the same og:image) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TradeLogger — Trading Journal & Research Terminal" />
    <meta
      name="twitter:description"
      content="Log trades, analyze performance, track risk, and follow market context in one place."
    />
    <meta name="twitter:image" content="https://tradelogger.site/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "TradeLogger",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "A private trading journal and research terminal — log trades, analyze performance, track risk, and follow market context. Read-only: no live order execution.",
        "url": "https://tradelogger.site/"
      }
    </script>
    <!-- Set the theme attribute before first paint so an explicit choice
         (localStorage) never flashes the other theme for a frame. No saved
         choice -> no attribute -> tokens.css falls through to the OS via
         prefers-color-scheme, same as if this script weren't here. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tl.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
