# Render Blueprint — the TradeLogger API (FastAPI adapter).
#
# One free web service. The broker sync is NOT an always-on loop here: the
# frontend calls /api/system/sync/run-if-stale on open, so a service that
# sleeps when idle is fine. See docs/DEPLOY.md.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then set the
# secret env vars (marked `sync: false`) in the service's Environment tab.
services:
  - type: web
    name: tradelogger-api
    runtime: python
    plan: free
    # region: singapore       # uncomment + set to match your Neon region
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Without this, ANY push to main restarts the whole API — including a
    # pure frontend/desktop/docs change that touches nothing this service
    # runs. That was needlessly cold-starting the backend on every commit
    # during active frontend work. Only redeploy for paths this service
    # actually executes.
    buildFilter:
      ignoredPaths:
        - frontend/**
        - desktop/**
        - docs/**
        - agent/**
        - .github/**
        - "**/*.md"
    envVars:
      # --- runtime tuning for a small, sleeping instance ---
      # PYTHON_VERSION must match local (3.14): its deferred annotation
      # evaluation (PEP 649) is load-bearing for some modules; 3.13 crashes
      # at import on a bare `X: Dict[str, Any]` where Any isn't in scope.
      - key: PYTHON_VERSION
        value: "3.14.3"   # the PYTHON_VERSION env var must be fully qualified
      # don't run the 7-route warm-up at boot
      - key: TL_SKIP_WARMUP
        value: "1"
      # Without this, Python fully-buffers stdout when it isn't a real
      # terminal (i.e. always, in a container) — print() calls from
      # capital_sync.py can sit unflushed for a long time, making the Logs
      # tab miss or badly reorder exactly the diagnostic lines you need
      # during a live sync issue. Forces every print() out immediately.
      - key: PYTHONUNBUFFERED
        value: "1"
      # Keep a small connection pool. `get_connection()` validates an idle
      # pooled socket with `SELECT 1` before handing it back, so a wake from
      # Render's sleep is handled — and reconnecting per query was hammering
      # the DB with TLS handshakes (egress). MIN=0 lets the pool drain to
      # nothing while the service is idle.
      - key: DB_POOL_ENABLED
        value: "1"
      - key: DB_POOL_MIN
        value: "0"
      - key: DB_POOL_MAX
        value: "6"
      # Broker auto-sync loop cadence when the toggle is on (default 120s).
      # Prefer leaving the toggle OFF on free hosting — sync-on-open covers it.
      - key: TL_SYNC_INTERVAL_SEC
        value: "120"
      # --- HTTPS + cross-site cookie (frontend is on another domain) ---
      - key: TL_AUTH_COOKIE_SECURE
        value: "1"
      - key: TL_AUTH_COOKIE_SAMESITE
        value: none
      # --- macro providers (same as local) ---
      - key: MACRO_DATA_PROVIDER
        value: fred
      - key: MACRO_COT_PROVIDER
        value: cftc
      - key: MACRO_CALENDAR_PROVIDER
        value: forexfactory
      # --- secrets: set these in the Render dashboard, never in git ---
      - key: DATABASE_URL            # Neon -> pooled connection URI (host has -pooler)
        sync: false
      - key: TL_AUTH_PASSWORD_HASH   # python -m api.auth  (or set TL_AUTH_PASSWORD)
        sync: false
      - key: TL_CREDENTIAL_ENC_KEY   # W8.5: python -m api.broker_credentials
        sync: false
      - key: TL_ALLOWED_ORIGINS      # https://<your-project>.pages.dev
        sync: false
      # --- multi-user (W10 §10): first-party email+password, invite-only ---
      - key: TL_AUTH_MODE            # 'multiuser' to turn it on; unset = single-user passphrase
        sync: false
      - key: TL_OWNER_EMAIL          # your email -> owner role + admin surface
        sync: false
      - key: TL_SIGNUP_ALLOWLIST     # comma-separated invited emails (include yours)
        sync: false
      # "Grand opening" switch: "1" bypasses TL_SIGNUP_ALLOWLIST entirely, so
      # anyone can create an account. Baked in as "0" (invite-only) here on
      # purpose -- flip it to "1" by hand in the Render dashboard when you're
      # actually ready, never by editing this file, so a blueprint re-sync
      # can't accidentally flip it either way. Once it's "1", the per-IP cap
      # (TL_SIGNUP_MAX_PER_IP, default 2 per TL_SIGNUP_WINDOW_HOURS, default
      # 24) is what stands between "free trial" and "one person, unlimited
      # accounts" -- the allowlist no longer does that job in this mode.
      - key: TL_SIGNUP_OPEN
        value: "0"
      - key: CAPITAL_API_KEY
        sync: false
      - key: CAPITAL_EMAIL
        sync: false
      - key: CAPITAL_PASSWORD
        sync: false
      - key: CAPITAL_ACCOUNT_ID
        sync: false
      - key: CAPITAL_IS_DEMO
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Cost-control kill switch, independent of the key above: set to "0" to
      # take the AI assistant off this deployment (e.g. before opening
      # sign-ups to the public) without touching the key itself, in case it's
      # still wanted for local use. Unset/"1" changes nothing. Turned back on
      # 2026-09-16 -- owner wants tradelogger.site to match local, AI
      # features included. Flip back to "0" if random-visitor API cost
      # becomes a problem (e.g. after TL_SIGNUP_OPEN is switched on).
      - key: TL_AI_ASSISTANT_ENABLED
        value: "1"
      - key: FRED_API_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
