# GitGuardian / ggshield configuration.
#
# Test files build fake credentials and mint dummy JWTs to exercise the auth
# and broker-credential code paths (W8). Every value in tests/ is throwaway
# fixture data — no test may contain a real secret by policy — so the secret
# scanner skips that tree to stop false positives on names like `SECRET`,
# `password`, `SUPABASE_JWT_SECRET`, and Fernet-shaped strings.
version: 2

secret:
  ignored-paths:
    - "tests/**"
    # frontend/.env.production holds only PUBLIC build values that Vite bakes
    # into the client bundle: the API base URL, and the Supabase project URL +
    # anon (publishable) key. The anon key is designed to ship in browser code
    # — access is gated by the backend allowlist and Supabase RLS, never by the
    # key's secrecy. The service-role key and JWT secret are never here.
    - "frontend/.env.production"
